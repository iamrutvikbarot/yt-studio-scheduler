name: Shorts & Reels Auto-Scheduler

on:
  schedule:
    # Other daily prime slots (IST: 9:30 AM, 1:30 PM, 8:30 PM, 10:30 PM)
    - cron: '0 4,8,15,17 * * *'
    # Every 5 minutes from 4:00 PM to 8:00 PM IST (10:30 to 14:30 UTC) using explicit POSIX cron lists
    - cron: '30,35,40,45,50,55 10 * * *'
    - cron: '*/5 11,12,13 * * *'
    - cron: '0,5,10,15,20,25,30 14 * * *'
  # Allows manual 1-click trigger from the GitHub Actions tab anytime
  workflow_dispatch:

concurrency:
  group: shorts-reels-auto-scheduler
  cancel-in-progress: false

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Scheduler & Uploader
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TIMEZONE_OFFSET_HOURS: ${{ vars.TIMEZONE_OFFSET_HOURS || '5.5' }}
        run: |
          python process_and_upload.py
